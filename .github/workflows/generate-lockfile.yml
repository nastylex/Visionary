name: Generate package-lock.json

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v45

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json
        run: |
          # Create a lockfile without installing node_modules
          npm install --package-lock-only

      - name: Commit package-lock.json if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "package-lock.json"; then
            git add package-lock.json
            git commit -m "chore: add package-lock.json (generated by workflow)"
            git push
          else
            echo "No package-lock.json changes to commit"
          fi
